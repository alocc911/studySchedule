name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript
        run: npm run check
      - name: Run frontend tests
        run: npm test

  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: study_schedule_ci
          MYSQL_USER: study_schedule
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u study_schedule -pci-only-password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, mysqli, pdo_mysql, pcntl
          tools: composer:v2
          coverage: none
      - name: Install CodeIgniter dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Lint application and integration PHP
        run: |
          php -l backend/app/Controllers/Api/Health.php
          php -l backend/app/Controllers/Api/Professor.php
          php -l backend/app/Controllers/Api/Participant.php
          php -l backend/app/Filters/ProfessorGuard.php
          php -l backend/app/Filters/ParticipantRateLimit.php
          php -l backend/app/Config/Auth.php
          php -l backend/app/Config/Security.php
          php -l backend/app/Config/Filters.php
          php -l backend/app/Config/Routes.php
          php -l deploy/cpanel-api-index.php
          find backend/app/Services backend/app/Database/Migrations backend/app/Notifications backend/app/Commands backend/tests/Integration -name '*.php' -print0 | xargs -0 -n 1 php -l
      - name: Configure isolated CI MySQL and apply migrations
        run: |
          cat > backend/.env <<'EOF'
          CI_ENVIRONMENT = development
          app.baseURL = 'http://127.0.0.1:8080/'
          database.default.hostname = 127.0.0.1
          database.default.database = study_schedule_ci
          database.default.username = study_schedule
          database.default.password = ci-only-password
          database.default.DBDriver = MySQLi
          database.default.port = 3306
          notifications.enabled = true
          notifications.fromEmail = 'scheduler@example.test'
          notifications.fromName = 'Hospitality Research'
          notifications.professorCopyEmail = ''
          notifications.smtp.host = '127.0.0.1'
          notifications.smtp.port = 1025
          notifications.smtp.crypto = 'none'
          notifications.smtp.username = ''
          notifications.smtp.password = ''
          EOF
          cd backend
          php spark migrate --all
      - name: Run PHP unit and integration tests against MySQL
        working-directory: backend
        env:
          STUDY_SCHEDULE_INTEGRATION: '1'
          STUDY_SCHEDULE_MAILPIT_SMOKE: '1'
        run: composer test
      - name: Send Mailpit previews and verify captured SMTP messages
        working-directory: backend
        run: |
          php spark notifications:preview
          mkdir -p build/mailpit-preview
          curl --fail --show-error --silent http://127.0.0.1:8025/api/v1/messages > build/mailpit-preview/message-index.json
          php -r '
            $data = json_decode(file_get_contents("build/mailpit-preview/message-index.json"), true);
            $subjects = array_map(fn ($x) => strtolower($x["Subject"] ?? ""), $data["messages"] ?? []);
            if (($data["total"] ?? 0) < 4) { fwrite(STDERR, "Mailpit captured fewer than four messages.\\n"); exit(1); }
            foreach (["confirmed", "canceled", "rescheduled"] as $subject) {
              if (!array_filter($subjects, fn ($s) => str_contains($s, $subject))) {
                fwrite(STDERR, "Missing email: " . $subject . "\\n"); exit(1);
              }
            }
            echo "Mailpit captured booking, cancellation and reschedule messages.\\n";
          '
          for id in $(jq -r '.messages[].ID' build/mailpit-preview/message-index.json); do
            curl --fail --show-error --silent "http://127.0.0.1:8025/api/v1/message/$id" > "build/mailpit-preview/$id.json"
            curl --fail --show-error --silent "http://127.0.0.1:8025/api/v1/message/$id/raw" > "build/mailpit-preview/$id.eml"
          done
      - name: Upload fictional email preview files
        uses: actions/upload-artifact@v4
        with:
          name: mailpit-email-previews
          path: backend/build/mailpit-preview/
          retention-days: 14
      - name: Verify API with real MySQL connection
        run: |
          cd backend
          php spark serve --host 127.0.0.1 --port 8080 > /tmp/study-schedule-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8080/health > /tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          curl --fail --show-error http://127.0.0.1:8080/ready | tee /tmp/ready.json
          php -r '$data=json_decode(file_get_contents("/tmp/ready.json"), true); if (($data["database"] ?? null) !== "connected") exit(1);'
          # The API must never expose professor data to anonymous browsers.
          admin_status=$(curl --silent --output /tmp/admin-denied.json --write-out '%{http_code}' http://127.0.0.1:8080/admin/me)
          cat /tmp/admin-denied.json
          test "$admin_status" = '401'
          php spark routes | grep 'admin/studies'
          # Participant API exists, but missing/invalid bearer credentials must
          # be rejected before reading participant data.
          missing_status=$(curl --silent --output /tmp/participant-denied.json --write-out '%{http_code}' http://127.0.0.1:8080/participant/invitation)
          cat /tmp/participant-denied.json
          test "$missing_status" = '404'
          php spark routes | grep 'participant/book'
