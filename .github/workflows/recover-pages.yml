name: Recover stuck GitHub Pages deployment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-pages.yml'
  workflow_dispatch:
    inputs:
      deployment_sha:
        description: "Stuck GitHub Pages deployment commit SHA to cancel"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  actions: write

jobs:
  cancel-and-redeploy:
    runs-on: ubuntu-latest
    env:
      STUCK_DEPLOYMENT_SHA: ${{ inputs.deployment_sha || '96aad93a12b86e99233834ceb10a9627977a9ffd' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate deployment identifier
        shell: bash
        run: |
          [[ "$STUCK_DEPLOYMENT_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Expected a 40-character commit SHA";
            exit 1;
          }
      - name: Cancel stale Pages deployment
        shell: bash
        run: |
          response_code=$(curl --silent --show-error --retry 2 \
            --output /tmp/cancel-response.txt --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/deployments/$STUCK_DEPLOYMENT_SHA/cancel")
          if [[ "$response_code" == "204" ]]; then
            echo "Stale deployment cancelled."
          elif [[ "$response_code" == "404" ]]; then
            echo "Deployment already missing; proceeding with a fresh attempt."
          else
            echo "::error::Cancel Pages deployment returned HTTP $response_code."
            cat /tmp/cancel-response.txt
            exit 1
          fi
      - name: Start a fresh Pages deployment workflow
        shell: bash
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
